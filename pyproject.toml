[build-system]
# >=77 for PEP 639 (SPDX license expression + license-files)
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alxedit2"
version = "0.2.0"
description = "alxedit2 — a personal IDE-style TUI file editor built on Textual"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex" }]
keywords = ["editor", "ide", "tui", "terminal", "textual"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Editors",
]
dependencies = [
    # the syntax extra pulls in tree-sitter + the highlight grammars
    "textual[syntax]>=8.2,<9",
]

[project.urls]
homepage = "https://github.com/aseiger/alxedit"
repository = "https://github.com/aseiger/alxedit"
issues = "https://github.com/aseiger/alxedit/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "build>=1.2",
]

[project.scripts]
alxedit2 = "alxedit2.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
