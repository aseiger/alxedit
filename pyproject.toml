[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alxedit2"
version = "0.1.0"
description = "alxedit2 — a personal IDE-style TUI file editor built on Textual"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alex" }]
keywords = ["editor", "ide", "tui", "terminal"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Text Editors",
]
dependencies = [
    # the syntax extra pulls in tree-sitter + the highlight grammars
    "textual[syntax]>=8.2,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
alxedit2 = "alxedit2.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
